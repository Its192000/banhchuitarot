<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EADCF0">
<meta name="description" content="Bánh chúi Tarot – xem tarot miễn phí, tự tay chọn lá, giải bài dễ thương mỗi ngày 🍌">
<style>body{margin:0;-webkit-text-size-adjust:100%}[hidden]{display:none!important}</style>
<title>Bánh chúi Tarot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: khung điện thoại ≤480px, nền lilac, nội dung trên card trắng bo lớn, nav dưới cố định. Một theme sáng (chủ ý). */
:root{
  --bg:#EADCF0; --bg-out:#D9C6E4; --card:#FFFFFF; --soft:#F6F0FA;
  --ink:#2B2340; --muted:#8B8299; --line:#E9DFF0;
  --pink:#F6C6E6; --lilac:#E3D3FF; --sky:#BFE6FA; --lime:#E6F78A; --banana:#FFD95A;
  --grad:linear-gradient(120deg,#E6F78A 0%,#F8C8DE 100%);
  --r-xl:32px; --r-lg:26px; --r-md:18px;
  --shadow:0 8px 28px rgba(96,62,128,.08);
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg-out);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid #9A7BE0;outline-offset:2px;border-radius:12px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}

.app{max-width:480px;margin:0 auto;min-height:100%;background:var(--bg);position:relative;
  background-image:radial-gradient(circle at 12% 6%,rgba(255,255,255,.7) 0 2px,transparent 3px),
  radial-gradient(circle at 88% 14%,rgba(255,255,255,.8) 0 1.5px,transparent 2.5px),
  radial-gradient(circle at 70% 42%,rgba(255,255,255,.6) 0 1.5px,transparent 2.5px);}
@media (min-width:520px){.app{box-shadow:0 0 0 1px rgba(96,62,128,.06),0 30px 80px rgba(96,62,128,.18)}}
.page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 130px;display:flex;flex-direction:column;gap:18px}
.page[hidden]{display:none!important}

/* ---------- common ---------- */
.card{background:var(--card);border-radius:var(--r-xl);box-shadow:var(--shadow);padding:20px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.h-big{font-size:28px;font-weight:800;line-height:1.2}
.h-sec{font-size:19px;font-weight:800}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-inline:4px}
.btn-main{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 26px;border-radius:999px;background:var(--grad);font-weight:700;font-size:16px;box-shadow:0 8px 20px rgba(230,170,200,.45);transition:transform .15s}
.btn-main:active{transform:scale(.97)}
.btn-main[disabled]{opacity:.55;box-shadow:none}
.btn-ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-weight:600}
.btn-ghost[disabled]{opacity:.6}
.btn-block{width:100%}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px;margin:-2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:44px;padding:0 16px;border-radius:999px;background:var(--soft);border:1.5px solid transparent;font-weight:600;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:background .2s,border-color .2s}
.chip[aria-pressed="true"]{background:var(--lilac);border-color:var(--ink)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:#9DC23A}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--soft)}
.pill.rev{background:#FFE1EC;color:#B03A6E}
.pill.soon{background:var(--sky);color:#235A78}
.kws{display:flex;flex-wrap:wrap;gap:6px}
.kw{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--soft)}
.foot{text-align:center;font-size:12px;color:var(--muted);padding-top:6px}
.disclaimer{font-size:12.5px;color:var(--muted);text-align:center}
.sparkle{position:absolute;pointer-events:none;color:#fff}
.sparkle svg{display:block}

/* ---------- tarot faces ---------- */
.face{--w:120px;width:var(--w);height:calc(var(--w)*1.6);border-radius:calc(var(--w)*.1);position:relative;flex:0 0 auto}
.face-art{position:absolute;inset:0;border-radius:inherit;background:var(--fc);overflow:hidden;
  box-shadow:inset 0 0 0 calc(var(--w)*.035) #fff,inset 0 0 0 calc(var(--w)*.05) var(--fd),0 4px 14px rgba(70,40,100,.14);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(var(--w)*.1) calc(var(--w)*.08) calc(var(--w)*.11);text-align:center}
.face-art .rn{font-size:calc(var(--w)*.12);font-weight:800;color:var(--fd);letter-spacing:.04em;line-height:1}
.face-art .orb{width:calc(var(--w)*.6);height:calc(var(--w)*.6);border-radius:50%;background:rgba(255,255,255,.75);display:grid;place-items:center;font-size:calc(var(--w)*.32);line-height:1;box-shadow:0 0 0 calc(var(--w)*.02) rgba(255,255,255,.9)}
.face-art .nm{font-size:calc(var(--w)*.105);font-weight:800;line-height:1.15;color:var(--ink)}
.face-art .en{font-size:calc(var(--w)*.072);font-weight:500;color:var(--fd);margin-top:2px;line-height:1.1}
.face-art .st{position:absolute;width:calc(var(--w)*.1);height:calc(var(--w)*.1);color:#fff}
.face.rev .face-art{transform:rotate(180deg)}
.cback{border-radius:10px;background-size:100% 100%;background-image:var(--back-img);box-shadow:0 4px 12px rgba(70,40,100,.18)}

/* ---------- home ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.brand .m{width:34px;height:34px}
.streak-badge{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;box-shadow:var(--shadow)}
.hello{position:relative;padding:6px 4px 0}
.hello p{margin-top:6px}
.daily{display:flex;flex-direction:column;gap:16px}
.daily-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.daily-empty{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#F7EEFF,#FDEFF6);border-radius:var(--r-lg);padding:16px}
.mini-fan{position:relative;width:96px;height:96px;flex:0 0 auto}
.mini-fan .cback{position:absolute;width:48px;height:76px;left:24px;top:8px;transform-origin:50% 100%}
.mini-fan .cback:nth-child(1){transform:rotate(-18deg) translateX(-8px)}
.mini-fan .cback:nth-child(3){transform:rotate(18deg) translateX(8px)}
.daily-done{display:flex;gap:14px;align-items:flex-start}
.daily-done .txt{display:flex;flex-direction:column;gap:8px;min-width:0}
.daily-done h3{font-size:18px;font-weight:800}
.comeback{background:var(--soft);border-radius:var(--r-md);padding:10px 14px;font-weight:600;font-size:14px;text-align:center}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;border-radius:16px;background:var(--soft);font-size:12px;font-weight:600;color:var(--muted)}
.day .b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#fff;font-size:14px}
.day.done{background:#FFF6CC;color:var(--ink)}
.day.done .b{background:var(--banana)}
.day.today{box-shadow:inset 0 0 0 1.5px var(--ink);color:var(--ink)}
.hscroll{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:4px max(16px,env(safe-area-inset-left,0px)) 10px;scroll-snap-type:x mandatory}
.hscroll::-webkit-scrollbar{display:none}
.feat{flex:0 0 172px;scroll-snap-align:start;border-radius:var(--r-lg);padding:16px;min-height:186px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;text-align:left;position:relative;overflow:hidden}
.feat h3{font-size:16px;font-weight:800;line-height:1.3}
.feat .ill{display:flex;gap:4px;align-items:flex-end;height:46px}
.feat .ill i{display:block;width:22px;height:36px;border-radius:5px;background:rgba(255,255,255,.75);box-shadow:0 2px 6px rgba(70,40,100,.1)}
.feat .ill i:nth-child(2){height:44px}
.feat .meta{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:600}
.weekly{display:flex;gap:16px;align-items:center}
.weekly .txt{display:flex;flex-direction:column;gap:6px;min-width:0}

/* ---------- nav ---------- */
.nav{position:fixed;bottom:0;left:0;right:0;margin:0 auto;max-width:480px;z-index:20;background:var(--card);border-radius:28px 28px 0 0;box-shadow:0 -6px 24px rgba(96,62,128,.1);
  padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;font-size:11px;font-weight:600;color:var(--muted)}
.nav .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;transition:background .2s,transform .2s}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] .ic{background:var(--lime);transform:translateY(-2px)}

/* ---------- spreads page ---------- */
.sp-list{display:flex;flex-direction:column;gap:12px}
.sp{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:var(--r-lg);padding:14px;box-shadow:var(--shadow);text-align:left;width:100%;min-height:76px}
.sp .num{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-weight:800;font-size:17px;flex:0 0 auto;line-height:1.05;text-align:center}
.sp .num small{display:block;font-size:10.5px;font-weight:600}
.sp .t{flex:1;min-width:0}
.sp .t b{display:block;font-size:15.5px}
.sp .t span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp .go{width:36px;height:36px;border-radius:50%;background:var(--lime);display:grid;place-items:center;flex:0 0 auto;font-weight:800}

/* ---------- library ---------- */
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:999px;padding:0 18px;min-height:52px;box-shadow:var(--shadow)}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;font-size:15px}
.lib{display:flex;flex-direction:column;gap:10px}
.lib-row{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:var(--r-md);padding:10px 14px 10px 10px;text-align:left;width:100%;box-shadow:var(--shadow)}
.lib-row .t{min-width:0;flex:1}
.lib-row b{display:block}
.lib-row span{font-size:12.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;padding:26px 18px;display:flex;flex-direction:column;align-items:center;gap:10px}

/* ---------- journal ---------- */
.jr{display:flex;flex-direction:column;gap:10px}
.jr-item{background:var(--card);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.jr-item .row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.jr-item .cards{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- me ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:14px}
.field input{min-height:50px;border-radius:16px;border:1.5px solid var(--line);padding:0 14px;background:var(--soft);font-size:16px;width:100%}
.destiny{display:flex;gap:16px;align-items:center;margin-top:16px}
.destiny .txt{display:flex;flex-direction:column;gap:6px;min-width:0}
.qr{width:180px;height:180px;margin:0 auto;border-radius:24px;border:2px dashed #CDB6E8;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:13px;padding:16px;background:var(--soft)}

/* ---------- overlay / sheet ---------- */
.overlay{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;max-width:480px;z-index:40;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  background:linear-gradient(180deg,#E6D6F6 0%,#F1E2F1 60%,#F7E8EF 100%);
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ov-top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px}
.icon-btn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.8);display:grid;place-items:center;font-size:18px;font-weight:700}
.ov-body{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;padding-top:8px}
.ov-body.left{align-items:stretch;text-align:left}
.breath{width:210px;height:210px;border-radius:50%;display:grid;place-items:center;position:relative;margin-block:8px}
.breath::before,.breath::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(246,198,230,.55) 60%,rgba(227,211,255,0) 72%);animation:breathe 8s ease-in-out infinite}
.breath::after{inset:-22px;opacity:.5;animation-delay:.25s}
.breath .m{width:110px;height:120px;position:relative;z-index:1}
@keyframes breathe{0%,100%{transform:scale(.82)}50%{transform:scale(1.05)}}
.breath-txt{font-weight:700;font-size:17px;min-height:26px}
.name-in{width:100%;text-align:left}

.shuffle-stage{position:relative;height:300px;width:100%;display:grid;place-items:center}
.sback{position:absolute;width:96px;height:154px;left:calc(50% - 48px);top:calc(50% - 77px);animation:shuf .75s ease-in-out 2}
@keyframes shuf{0%,50%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(var(--x1),var(--y1)) rotate(var(--r1))}75%{transform:translate(var(--x2),var(--y2)) rotate(var(--r2))}}

.pick-head{display:flex;flex-direction:column;gap:6px}
.scroller{position:relative;display:flex;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:64px 0 54px;width:calc(100% + 2*max(16px,env(safe-area-inset-left,0px)));touch-action:pan-x}
.scroller::-webkit-scrollbar{display:none}
.spacer{flex:0 0 calc(50% - 38px)}
.slot{flex:0 0 auto;width:76px;height:122px;margin-left:-32px;transform-origin:50% 120%;will-change:transform}
.spacer + .slot{margin-left:0}
.pcard{width:100%;height:100%;display:block;transition:transform .28s cubic-bezier(.3,.7,.3,1.3),box-shadow .28s;animation:deal .5s backwards cubic-bezier(.3,.7,.3,1)}
.slot.sel .pcard{transform:translateY(-34px);box-shadow:0 0 0 3px #fff,0 0 16px 6px rgba(248,200,222,.95),0 0 32px 12px rgba(230,247,138,.65)}
@keyframes deal{from{opacity:0;transform:translateY(50px)}}
.counter{display:inline-flex;gap:6px;align-items:center;background:#fff;border-radius:999px;padding:8px 16px;font-weight:700;box-shadow:var(--shadow)}
.swipe-hint{font-size:13px;color:var(--muted)}

.rv-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:22px 16px;width:100%}
.rv-slot{display:flex;flex-direction:column;align-items:center;gap:8px}
.rv-slot .pos{font-size:13px;font-weight:700;background:#fff;border-radius:999px;padding:4px 12px}
.flip{width:var(--w);height:calc(var(--w)*1.6);perspective:1100px;border-radius:calc(var(--w)*.1)}
.flip.pending{visibility:hidden}
[hidden]{display:none!important}
.flip{display:block;padding:0}
.flip-in{display:block;position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,.7,.25,1)}
.flip.on .flip-in{transform:rotateY(180deg)}
.side{display:block;position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:inherit}
.side.back{border-radius:calc(var(--w)*.1)}
.side.front{transform:rotateY(180deg)}
.side.front .face{--w:inherit}
.flip:not(.on){animation:wiggle 2.4s ease-in-out infinite}
@keyframes wiggle{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-2deg)}95%{transform:rotate(2deg)}}
.rv-slot .rev-tag{visibility:hidden}
.rv-slot.flipped .rev-tag{visibility:visible}
#fly{position:fixed;inset:0;pointer-events:none;z-index:60}
.fly-card{position:fixed;transform-origin:0 0}

.res-card{background:var(--card);border-radius:var(--r-xl);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.res-top{display:flex;gap:14px;align-items:flex-start}
.res-top .txt{display:flex;flex-direction:column;gap:6px;min-width:0}
.res-top h3{font-size:19px;font-weight:800;line-height:1.25}
.soft-note{background:#FFF1F6;border-radius:14px;padding:10px 12px;font-size:13.5px;font-weight:500}
.sum-card{border-radius:var(--r-xl);padding:20px;display:flex;flex-direction:column;gap:10px}
.sum-card.a{background:linear-gradient(140deg,#F2E9FF,#FCEAF4)}
.sum-card.b{background:linear-gradient(140deg,#F6FBD9,#FDEFF5)}
.sum-card h3{font-size:17px;font-weight:800;display:flex;gap:8px;align-items:center}
.sum-card .m{width:36px;height:40px;flex:0 0 auto}
.answer{font-size:30px;font-weight:800;text-align:center}
.actions{display:flex;flex-direction:column;gap:10px}

.sheet-bg{position:fixed;inset:0;background:rgba(43,35,64,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:88%;overflow-y:auto;background:var(--card);border-radius:30px 30px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .3s cubic-bezier(.3,.7,.3,1)}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 2px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.mean-box{background:var(--soft);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}

.welcome{position:fixed;inset:0;margin:0 auto;max-width:480px;z-index:70;background:linear-gradient(180deg,#E3D3FF 0%,#F6C6E6 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))}
.welcome .m{width:170px;height:184px;animation:bob 3s ease-in-out infinite}
.welcome-in{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px}
.welcome .acts{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px;margin-top:6px}
.welcome .skip{min-height:44px;font-weight:600;color:var(--ink);opacity:.75}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
.twinkle{animation:tw 2.2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}

.toast{position:fixed;left:0;right:0;margin:0 auto;bottom:calc(96px + env(safe-area-inset-bottom,0px));width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:80;box-shadow:0 10px 30px rgba(43,35,64,.3);animation:up .25s}

/* ---------- giai đoạn 2: hồ sơ, chủ đề, chat, story ---------- */
.top-right{display:flex;align-items:center;gap:8px}
.avatar-btn{width:44px;height:44px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-weight:800;font-size:16px}
.welcome{overflow-y:auto;justify-content:safe center}
.welcome .chip{background:rgba(255,255,255,.65)}
.welcome .chip[aria-pressed="true"]{background:#fff}
.ob-form{display:flex;flex-direction:column;gap:16px;width:100%;max-width:360px;text-align:left}
.ob-form fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.ob-form legend{font-weight:600;font-size:14px;padding:0;margin-bottom:8px}
.welcome .field input{background:rgba(255,255,255,.8);border-color:transparent}
.opt-row{display:flex;flex-wrap:wrap;gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.45}
.check input{width:22px;height:22px;flex:0 0 auto;accent-color:#8C6AD6;margin:0}
.topic-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.topic-tile{min-height:78px;border-radius:22px;background:#fff;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;padding:12px 14px;border:2px solid transparent;text-align:left;font-weight:700;font-size:15px}
.topic-tile .e{font-size:22px;line-height:1}
.topic-tile[aria-pressed="true"]{border-color:var(--ink);background:var(--lilac)}
.topic-tile:last-child:nth-child(odd){grid-column:span 2}
.field textarea{min-height:84px;border-radius:16px;border:1.5px solid var(--line);padding:12px 14px;background:#fff;font:inherit;font-size:16px;width:100%;resize:vertical}
.ov-body .field input{background:#fff}
.setup-sec{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left}
.pos-hint{font-size:13px;color:var(--muted)}
.chat{background:var(--card);border-radius:var(--r-xl);padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.chat h3{font-size:17px;font-weight:800}
.msgs{display:flex;flex-direction:column;gap:10px}
.msg{max-width:90%;padding:10px 14px;border-radius:20px;font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.bot{background:var(--soft);border-bottom-left-radius:6px;align-self:flex-start}
.msg.me{background:#F1FAC4;align-self:flex-end;border-bottom-right-radius:6px}
.msg .mini{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.msg .mini b{display:block}
.chat-form{display:flex;gap:8px}
.chat-form input{flex:1;min-width:0;min-height:48px;border-radius:999px;border:1.5px solid var(--line);padding:0 16px;background:var(--soft);font-size:16px}
.send{width:48px;height:48px;border-radius:50%;background:var(--grad);font-size:18px;font-weight:800;flex:0 0 auto}
.send[disabled]{opacity:.5}
.mini-pick{display:flex;justify-content:center;padding:18px 0 6px 14px}
.mini-pick button{width:46px;height:74px;margin-left:-14px;transition:transform .2s}
.mini-pick button:hover,.mini-pick button:focus-visible{transform:translateY(-10px)}
.story{position:fixed;left:0;top:0;z-index:-1;width:360px;height:640px;background:linear-gradient(180deg,#E3D3FF 0%,#F6C6E6 100%);padding:26px 22px 20px;display:flex;flex-direction:column;gap:14px;color:var(--ink);font-family:var(--font);overflow:hidden}
.story .st-top{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px}
.story .st-top svg{width:30px;height:32px}
.story h2{font-size:24px;font-weight:800;line-height:1.2}
.story .st-cards{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 8px}
.story .st-c{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:700;text-align:center}
.story .face-art{box-shadow:none;border:2px solid var(--fd)}
.story .st-sum{background:rgba(255,255,255,.85);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.5}
.story .st-foot{margin-top:auto;font-size:10.5px;text-align:center;color:#6E6380}
.story-img{width:100%;max-width:280px;border-radius:20px;margin:0 auto;display:block;box-shadow:0 10px 30px rgba(96,62,128,.2)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
</head>

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

  list.forEach(t=>t.nodeValue=nameText(t.nodeValue));
  if(root.querySelectorAll)root.querySelectorAll("[placeholder],[aria-label]").forEach(el=>{["placeholder","aria-label"].forEach(a=>{const v=el.getAttribute(a);if(v&&/[bB]ạn iu/.test(v))el.setAttribute(a,nameText(v))})})}
new MutationObserver(ms=>{if(!nick())return;for(const m of ms){if(m.type==="characterData"){const t=m.target;if(/[bB]ạn iu/.test(t.nodeValue))t.nodeValue=nameText(t.nodeValue)}else m.addedNodes.forEach(n=>{if(n.nodeType===3){if(/[bB]ạn iu/.test(n.nodeValue))n.nodeValue=nameText(n.nodeValue)}else if(n.nodeType===1)nameify(n)})}})

function fillN(s,names){return s.replace(/\{n\}/g,names[0]||"người ấy").replace(/\{a\}/g,`“${names[0]||"A"}”`).replace(/\{b\}/g,`“${names[1]||"B"}”`)}
function posLabel(sp,pos,names){
  if(sp.askName===2)return pos.replace(/ A$/,` “${names[0]||"A"}”`).replace(/ B$/,` “${names[1]||"B"}”`);
  if(sp.askName===1&&names[0]&&(pos==="Họ"))return names[0];
  return pos;
}
const qt=s=>s.includes("“")?s:`“${s}”`;

const MSG_POOL={

function localInterpret(r){
  const sp=SPREADS.find(s=>s.id===r.spread), n=r.cards.length, names=r.names||[];
  const avg=r.cards.reduce((a,c)=>a+tone(c.card,c.rev),0)/n;
  const lvl=avg>0.34?1:avg<-0.34?-1:0;
  const tp=TOPICS[r.topic]||TOPICS.self, Y=Youi();
  let summary;
  if(n===1){
    const c=r.cards[0].card,k=kws(c,r.cards[0].rev);
    if(r.spread==="yesno"){
      summary=lvl===1?`Lá ${c.vi} gật đầu với ${youi()} nè! Năng lượng ${k[0].toLowerCase()} và ${k[1].toLowerCase()} đang ủng hộ điều ${youi()} hỏi, cứ mạnh dạn nha ✨`
        :lvl===0?`Lá ${c.vi} chưa trả lời dứt khoát đâu. Mọi thứ còn tùy vào cách ${youi()} chuẩn bị, nhất là chuyện ${k[0].toLowerCase()}. Cho thêm chút thời gian nha 🌙`
        :`Lá ${c.vi} khuyên ${youi()} chưa nên vội. Có chút ${k[0].toLowerCase()} cần xử lý trước. Biết sớm là để chuẩn bị tốt hơn, chứ không phải để buồn đâu nha 💛`;
    }else{
      summary=lvl===1?`Hôm nay năng lượng ${tp.low} của ${youi()} sáng sủa lắm nè! Lá ${c.vi} mang theo ${k[0].toLowerCase()} và ${k[1].toLowerCase()}, nên cứ tự tin mà tiến nha ✨`
        :lvl===0?`Lá ${c.vi} nhắc ${youi()} rằng chuyện ${tp.low} hôm nay cần thêm chút ${k[0].toLowerCase()} và ${k[1].toLowerCase()}. Không xấu đâu, chỉ cần chậm lại và lắng nghe nhiều hơn xíu thôi 🌙`
        :`Lá ${c.vi} cho thấy chuyện ${tp.low} đang có chút ${k[0].toLowerCase()}. Bánh chúi nói thật để ${youi()} chuẩn bị, chứ không phải để lo đâu. Biết trước là nắm phần thắng rồi đó 💛`;
    }
  }else{
    const lab=c=>posLabel(sp,c.pos,names);
    const good=r.cards.filter(c=>tone(c.card,c.rev)>0).length, hard=r.cards.filter(c=>tone(c.card,c.rev)<0).length;
    const best=r.cards.slice().sort((a,b)=>tone(b.card,b.rev)-tone(a.card,a.rev))[0];
    const worst=r.cards.slice().sort((a,b)=>tone(a.card,a.rev)-tone(b.card,b.rev))[0];
    const who=sp.askName===1&&names[0]?` về ${names[0]}`:"";
    summary=`Trải “${sp.name}”${who} theo chủ đề ${tp.low} có ${good} lá sáng và ${hard} lá cần lưu ý. Điểm sáng nhất là ${qt(lab(best))} với lá ${best.card.vi}`+
      (tone(worst.card,worst.rev)<0?`, còn ${qt(lab(worst))} (${worst.card.vi}) là chỗ ${youi()} nên để tâm hơn.`:".");
    if(sp.id==="ab"){
      const sA=tone(r.cards[1].card,r.cards[1].rev)+tone(r.cards[2].card,r.cards[2].rev), sB=tone(r.cards[3].card,r.cards[3].rev)+tone(r.cards[4].card,r.cards[4].rev);
      const A=`“${names[0]||"A"}”`,B=`“${names[1]||"B"}”`;
      summary+=sA>sB?` So hai đường thì ${A} đang sáng hơn nè.`:sB>sA?` So hai đường thì ${B} đang sáng hơn nè.`:` Hai lựa chọn đang ngang nhau, nên ${youi()} hãy chọn điều làm mình thấy nhẹ lòng hơn nha.`;
    }else if(sp.id==="ex"||sp.id==="crush"){
      const key=r.cards[sp.id==="ex"?2:1], t=tone(key.card,key.rev);
      summary+=t>0?` Lá ${key.card.vi} ở ${qt(lab(key))} cho thấy cửa đang mở đó.`:t<0?` Lá ${key.card.vi} ở ${qt(lab(key))} cho thấy lúc này cửa còn khép, ${youi()} chăm mình trước nha.`:` Lá ${key.card.vi} ở ${qt(lab(key))} cho thấy mọi thứ còn để ngỏ.`;
    }
    summary+=lvl===1?" Nhìn chung mọi thứ đang thuận lắm nè ✨":lvl===0?" Nhìn chung đang cân bằng, quan trọng là cách bạn iu chọn bước tiếp 🌙":" Hơi nhiều thử thách xíu, nhưng lá nào cũng có lời khuyên kèm theo, mình làm từng bước nha 💛";
  }
  const pool=MSG_POOL[lvl], message=pool[hash(r.cards.map(c=>c.card.id).join()+r.ts)%pool.length];
  return {summary,message,level:lvl};
}
window.BanhChuiInterpreter={interpret:async r=>localInterpret(r)};

function destinyCard(iso){
  const digits=iso.replace(/\D/g,"").split("").map(Number);let sum=digits.reduce((a,b)=>a+b,0);const steps=[`${digits.join("+")} = ${sum}`];
  while(sum>22){const ds=String(sum).split("").map(Number);sum=ds.reduce((a,b)=>a+b,0);steps.push(`${ds.join("+")} = ${sum}`)}
  return {card:CARDS[sum===22?0:sum],steps,num:sum};
}

/* =========================================================
   SAO LƯU & KHÔI PHỤC
   Dữ liệu tự lưu trong trình duyệt (localStorage) mỗi lần dùng.
   File/mã sao lưu để chuyển máy hoặc phòng khi bị xóa.
   ========================================================= */
const BK_KEYS=["bc_profile","bc_daily","bc_journal","bc_birth","bc_topic","bc_seen"];
function backupData(){const o={v:1,at:Date.now()};BK_KEYS.forEach(k=>{const v=store.get(k,null);if(v!=null)o[k]=v});return o}
function backupCode(){const bytes=new TextEncoder().encode(JSON.stringify(backupData()));let bin="";bytes.forEach(b=>bin+=String.fromCharCode(b));return "BCT1:"+btoa(bin)}
async function backupFile(){
  const txt=JSON.stringify(backupData()),fname=`banh-chui-sao-luu-${dkey()}.json`;
  if(DL){try{await DL.save({filename:fname,data:new Blob([txt],{type:"application/json"})});toast("Lưu file sao lưu xong rồi nè 💾")}catch(e){if(!e||e.code!=="declined")toast("Chưa lưu được file, bạn iu dùng mã sao lưu nha")}return}
  const url=URL.createObjectURL(new Blob([txt],{type:"application/json"}));const a=document.createElement("a");a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);
  toast("Bánh chúi tải file sao lưu về máy rồi nè 💾");
}
function restoreFrom(raw){
  let o;try{raw=String(raw||"").trim();
    if(raw.startsWith("BCT1:")){const bin=atob(raw.slice(5).replace(/\s/g,""));o=JSON.parse(new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0))))}
    else o=JSON.parse(raw);
  }catch(e){toast("Mã sao lưu chưa đúng rồi, bạn iu kiểm tra lại nha");return false}
  if(!o||o.v!==1){toast("File này không phải sao lưu của Bánh chúi nè");return false}
  /* gộp, không ghi đè mất dữ liệu đang có */
  const j=getJournal(),keys=new Set(j.map(e=>e.key));(o.bc_journal||[]).forEach(e=>{if(e&&e.key&&!keys.has(e.key))j.push(e)});
  j.sort((a,b)=>b.ts-a.ts);store.set("bc_journal",j.slice(0,200));
  const d=getDaily();Object.entries(o.bc_daily||{}).forEach(([k,v])=>{d[k]=Object.assign({},v,d[k]||{})});store.set("bc_daily",d);
  if(o.bc_profile&&!PROFILE){PROFILE=o.bc_profile;store.set("bc_profile",PROFILE)}
  ["bc_birth","bc_topic"].forEach(k=>{if(o[k]!=null&&store.get(k,null)==null)store.set(k,o[k])});
  store.set("bc_seen",1);
  toast(`Khôi phục xong rồi nè, ${youi()} 💛`);return true;
}

  top(title,back){return `<div class="ov-top">${back?`<button class="icon-btn" data-back="${back}" aria-label="Quay lại">‹</button>`:'<span style="width:44px"></span>'}<b style="text-align:center;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(title)}</b><button class="icon-btn" data-x aria-label="Đóng">✕</button></div>`},
  /* Bước 1: chọn chủ đề + tên + câu hỏi */
  setup(){
    const {sp,topic,names,question}=this.st;
    const nameFields=sp.askName===2?`<div class="setup-sec"><div class="field"><label for="nm-a">Lựa chọn A</label><input id="nm-a" maxlength="30" value="${esc(names[0]||"")}" placeholder="Ví dụ: ở lại công ty cũ"></div><div class="field"><label for="nm-b">Lựa chọn B</label><input id="nm-b" maxlength="30" value="${esc(names[1]||"")}" placeholder="Ví dụ: chuyển việc mới"></div></div>`
      :sp.askName?`<div class="setup-sec"><div class="field"><label for="nm-a">Tên hoặc nickname của người ấy</label><input id="nm-a" maxlength="30" value="${esc(names[0]||"")}" placeholder="Để Bánh chúi gọi đúng tên nha"></div></div>`:"";
    const head=sp.pickTopic?[`${Youi()} muốn hỏi về chuyện gì nè?`,"Chọn chủ đề để Bánh chúi giải đúng chuyện bạn iu đang nghĩ nha."]
      :sp.askName===2?["Hai lựa chọn của bạn iu là gì nè?","Ghi ngắn gọn thôi, Bánh chúi sẽ gọi đúng tên từng lựa chọn khi giải."]
      :["Người ấy là ai nè?","Cho Bánh chúi biết tên hoặc nickname để lời giải gọi đúng người nha."];
    this.el.innerHTML=`${this.top(sp.name)}<div class="ov-body">
      <div style="display:flex;flex-direction:column;gap:6px"><h2 class="h-big">${esc(head[0])}</h2>
      <p class="muted">${head[1]}</p></div>
      ${sp.pickTopic?`<div class="topic-grid" role="group" aria-label="Chủ đề">${Object.entries(TOPICS).map(([k,t])=>`<button class="topic-tile" data-tp="${k}" aria-pressed="${k===topic}"><span class="e">${t.emo}</span>${t.label}</button>`).join("")}</div>`:""}
      ${nameFields}
      ${sp.pickTopic?`<div class="setup-sec"><div class="field"><label for="q-in">${sp.askQ?"Câu hỏi Có/Không của bạn iu":"Câu hỏi của bạn iu (không bắt buộc)"}</label>
      <textarea id="q-in" maxlength="200" placeholder="${sp.askQ?"Ví dụ: Mình có nên nhắn tin cho bạn ấy trước không?":"Viết ra câu hỏi giúp bạn iu tập trung hơn đó"}">${esc(question)}</textarea></div></div>`:""}
      <button class="btn-main btn-block" id="to-focus" style="max-width:340px">Tiếp nè ✨</button></div>`;
    this.el.scrollTop=0;
  },
  fromSetup(){
    const sp=this.st.sp,a=$("#nm-a"),b=$("#nm-b"),q=$("#q-in");
    if(a&&!a.value.trim()){a.focus();toast(sp.askName===2?"Bạn iu ghi lựa chọn A giúp Bánh chúi nha":"Bạn iu cho Bánh chúi biết tên người ấy nha");return}
    if(b&&!b.value.trim()){b.focus();toast("Bạn iu ghi lựa chọn B nữa nha");return}
    if(sp.askQ&&q&&!q.value.trim()){q.focus();toast("Bạn iu viết câu hỏi Có/Không ra giúp Bánh chúi nha");return}
    this.st.names=[a&&a.value.trim(),b&&b.value.trim()].filter(Boolean);
    this.st.question=q?q.value.trim():"";
    this.focus();
  },
  /* Bước 2: tập trung */
  focus(){
    const {sp,topic}=this.st, sub=sp.id==="daily"?`Lá bài hôm nay · ${TOPICS[topic].label}`:sp.pickTopic?`${sp.name} · ${TOPICS[topic].label}`:sp.name;
    this.el.innerHTML=`${this.top(sub,(sp.pickTopic||sp.askName)?"setup":"")}<div class="ov-body">
      <h2 class="h-big">Tập trung nè ✨</h2>
      <div class="breath">${mascot("m")}</div>
      <p class="breath-txt" id="breath-txt" aria-live="polite">Hít vào thật sâu…</p>
      ${this.st.question?`<p style="font-weight:600;max-width:320px">“${esc(this.st.question)}”</p>`:""}
      <p class="muted" style="max-width:320px">${esc(Youi())} hít một hơi thật sâu, thở ra thật chậm, rồi nghĩ về câu hỏi trong lòng nha. Khi thấy sẵn sàng thì bấm xào bài.</p>
      <button class="btn-main btn-block" id="do-shuffle" style="max-width:340px">Xào bài 🍌</button></div>`;
    this.el.scrollTop=0;
    let inhale=true;clearInterval(this.timer);
    this.timer=setInterval(()=>{inhale=!inhale;const t=$("#breath-txt");if(t)t.textContent=inhale?"Hít vào thật sâu…":"Thở ra thật chậm…"},4000);
  },
  shuffleAnim(){
    clearInterval(this.timer);vibrate(20);
    let backs="";for(let i=0;i<10;i++){const r=()=>Math.round(Math.random()*120-60);
      backs+=`<span class="cback sback" style="--x1:${r()}px;--y1:${r()/2}px;--r1:${r()/3}deg;--x2:${r()}px;--y2:${r()/2}px;--r2:${r()/3}deg;animation-delay:${i*25}ms"></span>`}
    this.el.innerHTML=`${this.top("Đang xào bài")}<div class="ov-body"><h2 class="h-big">Bánh chúi đang xào bài…</h2><div class="shuffle-stage">${backs}</div><p class="muted">Nghĩ thật kỹ về câu hỏi của bạn iu nha 🌙</p></div>`;
    this.st.deck=shuffle(this.st.deck);
    setTimeout(()=>this.pick(),RM?200:1550);
  },
  pick(){
    const {sp}=this.st;this.st.sel=[];
    let slots="";for(let i=0;i<78;i++)slots+=`<div class="slot" data-i="${i}"><button class="pcard cback" aria-label="Lá úp số ${i+1}" style="animation-delay:${RM?0:Math.min(i,40)*12}ms"></button></div>`;
    this.el.innerHTML=`${this.top(sp.id==="daily"?"Lá bài hôm nay":sp.name)}<div class="ov-body">
      <div class="pick-head"><h2 class="h-sec">${esc(Youi())} ơi, Bánh chúi xào bài xong rồi nè 🍌✨</h2>
      <p class="muted">${sp.n===1?"Chọn 1 lá mà bạn iu thấy có duyên nhất nha.":`Chọn ${sp.n} lá theo cảm giác của bạn iu nha.`} Chạm lần nữa để bỏ chọn.</p></div>
      <div class="scroller" id="sc"><span class="spacer"></span>${slots}<span class="spacer"></span></div>
      <p class="swipe-hint">‹ Vuốt ngang để xem hết 78 lá ›</p>
      <span class="counter" id="counter" aria-live="polite">Đã chọn 0/${sp.n} lá</span>
      <button class="btn-main btn-block" id="do-reveal" hidden style="max-width:340px">Lật bài thôi!</button></div>`;
    const sc=$("#sc"),sl=$$(".slot",sc);
    const offs=sl.map(s=>s.offsetLeft+38);
    let raf=0;const arc=()=>{raf=0;const half=sc.clientWidth/2,c=sc.scrollLeft+half;
      sl.forEach((s,i)=>{let n=(offs[i]-c)/half;n=Math.max(-1.5,Math.min(1.5,n));s.style.transform=`translateY(${(n*n*30).toFixed(1)}px) rotate(${(n*13).toFixed(2)}deg)`})};
    sc.scrollLeft=(sc.scrollWidth-sc.clientWidth)/2+(Math.random()*400-200);arc();
    sc.addEventListener("scroll",()=>{if(!raf)raf=requestAnimationFrame(arc)},{passive:true});
    sc.addEventListener("click",e=>{const s=e.target.closest(".slot");if(s)this.toggle(s)});
  },
  toggle(s){
    const i=+s.dataset.i,sel=this.st.sel,n=this.st.sp.n,at=sel.indexOf(i);
    if(at>=0){sel.splice(at,1);s.classList.remove("sel")}
    else{
      if(sel.length>=n){
        if(n===1){const old=$(`.slot[data-i="${sel[0]}"]`);old&&old.classList.remove("sel");sel.length=0}
        else{toast("Đủ lá rồi nè, bỏ chọn một lá trước nha bạn iu");return}
      }
      sel.push(i);s.classList.add("sel");vibrate(15);
    }
    $("#counter").textContent=`Đã chọn ${sel.length}/${n} lá`;
    $("#do-reveal").hidden=sel.length!==n;
  },
  reveal(){
    const st=this.st;
    const src=st.sel.map(i=>$(`.slot[data-i="${i}"] .pcard`).getBoundingClientRect());
    st.cards=st.sel.map((_,k)=>({card:st.deck[k],rev:Math.random()<0.3,pos:st.pos[k]}));
    st.key=st.sp.id==="daily"?"daily-"+dkey()+"-"+st.topic:st.sp.id+"-"+st.ts;
    if(st.sp.id==="daily"){setDaily(st.topic,st.cards[0].card.id,st.cards[0].rev);saveJournal(this.reading())}
    const n=st.cards.length,w=n===1?168:n===4?110:n<=3?104:n<=6?96:70;
    const posL=k=>st.sp.id==="daily"?`${TOPICS[st.topic].emo} ${TOPICS[st.topic].label}`:posLabel(st.sp,st.pos[k],st.names);
    this.el.innerHTML=`${this.top(st.sp.id==="daily"?"Lá bài hôm nay":st.sp.name)}<div class="ov-body">
      <h2 class="h-sec">Chạm vào lá để lật nha ${esc(youi())} ✨</h2>
      <div class="rv-grid">${st.cards.map((c,k)=>`<div class="rv-slot" data-k="${k}" style="max-width:${Math.max(w,96)}px"><span class="pos" style="text-align:center">${esc(posL(k))}</span>
        <button class="flip pending" style="--w:${w}px" aria-label="Lật lá ${esc(posL(k))}"><span class="flip-in"><span class="side back cback"></span><span class="side front">${faceHTML(c.card,w,c.rev)}</span></span></button>
        <span class="pill rev rev-tag"${c.rev?"":' style="display:none"'}>Ngược</span></div>`).join("")}</div>
      ${n>2?'<button class="btn-ghost" id="flip-all">Lật hết một lượt</button>':""}
      <button class="btn-main btn-block" id="to-result" hidden style="max-width:340px">Xem lời giải của Bánh chúi 💛</button></div>`;
    this.el.scrollTop=0;
    const targets=$$(".flip",this.el);
    if(RM){targets.forEach(t=>t.classList.remove("pending"));return}
    const layer=$("#fly");
    targets.forEach((t,i)=>{const s=src[i],r=t.getBoundingClientRect();
      const el=document.createElement("div");el.className="cback fly-card";
      Object.assign(el.style,{left:s.left+"px",top:s.top+"px",width:s.width+"px",height:s.height+"px"});layer.appendChild(el);
      const dx=r.left-s.left,dy=r.top-s.top,sx=r.width/s.width,sy=r.height/s.height;
      const done=()=>{t.classList.remove("pending");el.remove()};
      const an=el.animate([{transform:"translate(0,0) scale(1,1) rotate(0)"},{offset:.55,transform:`translate(${dx*.55}px,${dy*.55-60}px) scale(${(1+sx)/2},${(1+sy)/2}) rotate(-8deg)`},{transform:`translate(${dx}px,${dy}px) scale(${sx},${sy}) rotate(0)`}],
        {duration:780,delay:i*110,easing:"cubic-bezier(.4,.1,.2,1)",fill:"forwards"});
      an.finished.then(done,done);
    });
  },
  flip(btn){
    if(btn.classList.contains("on")||btn.classList.contains("pending"))return;
    btn.classList.add("on");btn.closest(".rv-slot").classList.add("flipped");vibrate(12);
    if($$(".flip:not(.on)",this.el).length===0){const fa=$("#flip-all");fa&&(fa.hidden=true);
      setTimeout(()=>{const b=$("#to-result");if(b){b.hidden=false;b.scrollIntoView({behavior:RM?"auto":"smooth",block:"center"})}},RM?0:700)}
  },
  reading(){const st=this.st;return {spread:st.sp.id,topic:st.topic,names:st.names,question:st.question,pos:st.pos,ts:st.ts,key:st.key,cards:st.cards,chat:st.chat,qa:st.qa||""}},
  showSaved(r){
    const sp=SPREADS.find(s=>s.id===r.spread);
    this.st={sp,topic:r.topic||"self",names:r.names||[],question:r.question||"",pos:r.pos||sp.pos,ts:r.ts,key:r.key,cards:r.cards,chat:r.chat||[],qa:r.qa||"",
      deck:shuffle(CARDS.filter(c=>!r.cards.some(x=>x.card.id===c.id)))};
    this.el.hidden=false;document.body.style.overflow="hidden";this.result();
  },
  async result(){
    const r=this.reading(),sp=this.st.sp,names=r.names||[];
    this.el.innerHTML=`${this.top("Lời giải")}<div class="ov-body left"><p class="muted" style="text-align:center">Bánh chúi đang đọc bài cho bạn iu…</p></div>`;
    const it=await window.BanhChuiInterpreter.interpret(r);this.st.interp=it;
    const yn=sp.id==="yesno"?yesNo(r.cards[0].card,r.cards[0].rev):null;
    const saved=inJournal(r.key);
    this.el.innerHTML=`${this.top("Lời giải")}<div class="ov-body left">
     <div style="text-align:center;display:flex;flex-direction:column;gap:4px"><span class="eyebrow">${esc(sp.id==="daily"?"Lá bài hôm nay":sp.name)} · ${TOPICS[r.topic].label}</span>
       ${yn?`<p class="answer">${yn.t}</p><p class="muted">${yn.s}</p>`:`<h2 class="h-big">Bài của ${esc(youi())} nè 🍌</h2>`}
       ${r.question?`<p style="font-weight:600">“${esc(r.question)}”</p>`:""}</div>
     ${r.cards.map(c=>{const hint=posHint(sp,c.pos,names);return `<article class="res-card"><div class="res-top">${faceHTML(c.card,96,c.rev)}<div class="txt">
        <span class="eyebrow">${esc(sp.id==="daily"?"Lá hôm nay":posLabel(sp,c.pos,names))}</span><h3>${esc(c.card.vi)}</h3><span class="muted" style="font-size:13px">${esc(c.card.en)}</span>
        <div class="kws">${c.rev?'<span class="pill rev">Ngược</span>':'<span class="pill">Xuôi</span>'}${kws(c.card,c.rev).map(k=>`<span class="kw">${k}</span>`).join("")}</div></div></div>
        ${hint&&sp.id!=="daily"?`<p class="pos-hint">${esc(hint)}</p>`:""}
        ${tone(c.card,c.rev)<0?`<p class="soft-note">${HARD_NOTE}</p>`:""}
        <p>${esc(meaning(c.card,r.topic,c.rev))}</p></article>`}).join("")}
     ${r.question&&(this.st.qa||SAMPLE)?`<section class="sum-card a" style="background:#fff;box-shadow:var(--shadow)"><h3>🔮 Trả lời câu hỏi của ${esc(youi())}</h3><p id="qa-text">${esc(this.st.qa||"Bánh chúi đang ngẫm câu hỏi của bạn iu nè…")}</p></section>`:""}
     <section class="sum-card a"><h3>${mascot("m")}Tổng kết của Bánh chúi</h3><p>${esc(it.summary)}</p></section>
     <section class="sum-card b"><h3>💌 Lời nhắn của Bánh chúi</h3><p>${esc(it.message)}</p></section>
     <p class="disclaimer">${DISCLAIMER}</p>
     <div class="actions">
       <button class="btn-main btn-block" id="story">Lưu ảnh để đăng story 📸</button>
       <button class="btn-ghost btn-block" id="save-j" ${saved?"disabled":""}>${saved?"Đã lưu vào nhật ký ✓":"Lưu vào nhật ký"}</button>
       <button class="btn-ghost btn-block" id="other">Bốc trải khác</button></div>
     <section class="chat" id="chat" aria-label="Chat thêm với Bánh chúi"></section>
     ${FOOT}</div>`;
    this.el.scrollTop=0;
    Chat.mount();
    if(r.question&&!this.st.qa&&SAMPLE)Chat.answerQuestion();
  }
};
Flow.el.addEventListener("click",e=>{
  if(e.target.closest("[data-x]")){Flow.close();return}
  const bk=e.target.closest("[data-back]");if(bk){clearInterval(Flow.timer);Flow[bk.dataset.back]();return}
  const tp=e.target.closest("[data-tp]");if(tp){Flow.st.topic=tp.dataset.tp;$$("[data-tp]",Flow.el).forEach(x=>x.setAttribute("aria-pressed",x===tp));return}
  if(e.target.closest("#to-focus")){Flow.fromSetup();return}
  if(e.target.closest("#do-shuffle")){Flow.shuffleAnim();return}
  if(e.target.closest("#do-reveal")){Flow.reveal();return}
  if(e.target.closest("#flip-all")){$$(".flip:not(.on)",Flow.el).forEach((f,i)=>setTimeout(()=>Flow.flip(f),RM?0:i*160));return}
  const f=e.target.closest(".flip");if(f){Flow.flip(f);return}
  if(e.target.closest("#to-result")){Flow.result();return}
  if(e.target.closest("#story")){makeStory(Flow.reading(),Flow.st.interp);return}
  if(e.target.closest("#save-j")){if(saveJournal(Flow.reading())){const b=$("#save-j");b.disabled=true;b.textContent="Đã lưu vào nhật ký ✓";toast("Bánh chúi cất vào nhật ký rồi nè 📔")}return}
  if(e.target.closest("#other")){TAB="spreads";Flow.close();return}
  Chat.click(e);
});
Flow.el.addEventListener("submit",e=>{if(e.target.id==="chat-form"){e.preventDefault();Chat.submit()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){const s=$(".sheet-bg");if(s){s.remove();return}if(!Flow.el.hidden)Flow.close()}});

/* =========================================================
   CHAT THÊM VỚI BÁNH CHÚI
   Có AI (khi mở trong Claude) thì trò chuyện tự do; không có thì
   Bánh chúi trả lời dựa trên các lá đã bốc + cho rút thêm lá làm rõ.
   ========================================================= */
const MAX_EXTRA=3;
const Chat={
  busy:false,picking:false,ctl:null,
  get st(){return Flow.st},
  mount(){
    if(!this.st.chat.length)this.st.chat.push({role:"bot",text:`${Youi()} còn thắc mắc gì không nè? Hỏi thêm Bánh chúi, hoặc rút thêm 1 lá để làm rõ nha 🍌`});
    this.picking=false;this.render();
  },
  extraCount(){return this.st.chat.filter(m=>m.card).length},
  render(){
    const box=$("#chat");if(!box)return;
    const left=MAX_EXTRA-this.extraCount();
    box.innerHTML=`<h3>💬 Chat thêm với Bánh chúi</h3>
     <div class="msgs" id="msgs" aria-live="polite">${this.st.chat.map(m=>this.msgHTML(m)).join("")}</div>
     ${this.picking?`<div><p class="muted" style="text-align:center;font-size:13px">Chạm 1 lá bạn iu thấy có duyên nha</p><div class="mini-pick">${Array.from({length:7},(_,i)=>`<button class="cback" data-xpick="${i}" aria-label="Lá úp ${i+1}"></button>`).join("")}</div></div>`:""}
     <div class="chips">
       ${left>0?`<button class="chip" data-q="draw">🃏 Rút thêm 1 lá (${left})</button>`:""}
       <button class="chip" data-q="Giờ mình nên làm gì tiếp?">Giờ mình nên làm gì?</button>
       <button class="chip" data-q="Giải kỹ hơn giúp mình nha">Giải kỹ hơn giúp mình</button></div>
     <form class="chat-form" id="chat-form"><input id="chat-in" maxlength="300" placeholder="Hỏi thêm Bánh chúi nè…" aria-label="Câu hỏi cho Bánh chúi" autocomplete="off">
     <button class="send" aria-label="Gửi" ${this.busy?"disabled":""}>➤</button></form>`;
  },
  msgHTML(m){
    if(m.role==="me")return `<div class="msg me">${esc(m.text)}</div>`;
    const c=m.card&&byId(m.card.id);
    return `<div class="msg bot">${c?`<div class="mini">${faceHTML(c,54,m.card.rev)}<div><span class="eyebrow">Lá làm rõ</span><b>${esc(c.vi)}${m.card.rev?" (ngược)":""}</b></div></div>`:""}${esc(m.text)}</div>`;
  },
  push(m){this.st.chat.push(m);updateJournal(Flow.reading());this.render();const ms=$("#msgs");ms&&ms.lastElementChild&&ms.lastElementChild.scrollIntoView({behavior:RM?"auto":"smooth",block:"nearest"})},
  click(e){
    const q=e.target.closest("[data-q]");
    if(q){if(this.busy)return;
      if(q.dataset.q==="draw"){if(this.extraCount()>=MAX_EXTRA){toast("Rút nhiều quá dễ rối lắm, bạn iu đọc kỹ các lá hiện có nha");return}this.picking=true;this.render();return}
      this.ask(q.dataset.q);return}
    const x=e.target.closest("[data-xpick]");if(x){this.drawExtra();return}
  },
  submit(){const i=$("#chat-in");const v=i.value.trim();if(!v||this.busy)return;i.value="";this.ask(v)},
  drawExtra(){
    const st=this.st, used=new Set([...st.cards.map(c=>c.card.id),...st.chat.filter(m=>m.card).map(m=>m.card.id)]);
    const pool=(st.deck||CARDS).filter(c=>!used.has(c.id)), c=pool.length?pool[Math.floor(Math.random()*pool.length)]:CARDS[Math.floor(Math.random()*CARDS.length)];
    const rev=Math.random()<0.3;vibrate(15);this.picking=false;
    const k=kws(c,rev);
    this.push({role:"bot",card:{id:c.id,rev},text:`Lá này mang năng lượng ${k[0].toLowerCase()}, ${k[1].toLowerCase()}.${tone(c,rev)<0?" Hơi khó chịu xíu, nhưng biết trước là để chuẩn bị nha.":""} ${meaning(c,st.topic,rev)}`});
  },
  localAnswer(q){
    const st=this.st, sp=st.sp, names=st.names||[], all=[...st.cards,...st.chat.filter(m=>m.card).map(m=>({card:byId(m.card.id),rev:m.card.rev,pos:"Lá làm rõ"}))];
    const nq=norm(q);
    if(/lam gi|nen|loi khuyen|tiep theo|cach nao/.test(nq)){
      const adv=st.cards.find(c=>ADVICE_POS.includes(c.pos))||st.cards[st.cards.length-1];
      return {text:`Theo lá ${adv.card.vi}${sp.n>1?` ở vị trí ${qt(posLabel(sp,adv.pos,names))}`:""}, Bánh chúi nghĩ ${youi()} nên: ${meaning(adv.card,st.topic,adv.rev)}\n\nBắt đầu từ một việc nhỏ nhất làm được ngay hôm nay nha 💛`};
    }
    if(/ky hon|chi tiet|ro hon|giai thich|tong ket/.test(nq)){
      const lines=all.map(c=>`• ${sp.n>1||c.pos==="Lá làm rõ"?(c.pos==="Lá làm rõ"?"Lá làm rõ":posLabel(sp,c.pos,names))+": ":""}${c.card.vi}${c.rev?" (ngược)":""} – ${kws(c.card,c.rev).join(", ").toLowerCase()}`);
      return {text:`Ghép các lá lại nè:\n${lines.join("\n")}\n\n${st.interp?st.interp.summary:""}`};
    }
    return {text:`Câu này Bánh chúi muốn hỏi thêm lá bài cho chắc nè. ${Youi()} rút thêm 1 lá làm rõ nha 🃏`,draw:this.extraCount()<MAX_EXTRA};
  },
  rules(){
    const st=this.st, sp=st.sp, names=st.names||[];
    const cards=st.cards.map(c=>`- ${sp.id==="daily"?"Lá hôm nay":posLabel(sp,c.pos,names)}: ${c.card.vi} (${c.card.en}), ${c.rev?"ngược":"xuôi"}; từ khóa: ${kws(c.card,c.rev).join(", ")}; ý nghĩa gốc: ${meaning(c.card,st.topic,c.rev)}`).join("\n");
    const extra=st.chat.filter(m=>m.card).map(m=>{const c=byId(m.card.id);return `- Lá làm rõ: ${c.vi}, ${m.card.rev?"ngược":"xuôi"}; từ khóa: ${kws(c,m.card.rev).join(", ")}`}).join("\n");
    const p=PROFILE||{};
    return `Bạn là "Bánh chúi", một trái chuối nhỏ dễ thương xem tarot trên web Bánh chúi Tarot.
Giọng văn: ${nick()?`gọi người dùng bằng tên "${nick()}" (không thêm "bạn iu" trước tên)`:'gọi người dùng là "bạn iu"'}, tự xưng "Bánh chúi". Dễ thương, ấm áp, hơi nhõng nhẽo, emoji vừa phải (🍌✨💛🌙). Gặp lá xấu thì nói thật nhưng nhẹ nhàng và luôn kèm hướng giải quyết.
Quy tắc: trả lời bằng tiếng Việt, 3–6 câu, văn xuôi thuần, không dùng markdown, không gạch đầu dòng dài. Chỉ dựa vào các lá đã rút bên dưới; nếu câu hỏi cần thêm thông tin thì gợi ý người dùng bấm "Rút thêm 1 lá". Không khẳng định chắc chắn về sức khỏe, pháp lý, tiền bạc hay chuyện sống chết; với những chuyện đó nhắc họ hỏi người có chuyên môn. Nếu người dùng có dấu hiệu buồn nặng nề hoặc nghĩ tới việc làm hại bản thân, hãy dịu dàng khuyên họ nói chuyện với người thân tin cậy hoặc chuyên gia ngay. Không bịa thêm lá bài.
Thông tin người dùng: ${p.gender?`giới tính ${p.gender}, `:""}${p.age?`độ tuổi ${p.age}`:""}
Trải bài: ${sp.name}. Chủ đề: ${TOPICS[st.topic].label}.${names.length?` Tên/lựa chọn liên quan: ${names.join(" / ")}.`:""}${st.question?` Câu hỏi ban đầu: "${st.question}".`:""}
Các lá:
${cards}${extra?"\n"+extra:""}
Tổng kết đã đưa: ${st.interp?st.interp.summary:""}`;
  },
  async answerQuestion(){
    const st=Flow.st,el=()=>$("#qa-text");
    const prompt=this.rules()+`\n\nNhiệm vụ: trả lời THẲNG vào câu hỏi "${st.question}" dựa trên các lá trên. Câu đầu tiên phải trả lời trực tiếp (ví dụ có/chưa/nên/không nên, hoặc điều cốt lõi), sau đó giải thích bằng 2–4 câu, nhắc tên lá và vị trí liên quan, cuối cùng là một việc cụ thể nên làm.`;
    try{const {text}=await SAMPLE(prompt,{modelTier:"quick",onText:({text})=>{const e=el();if(e)e.textContent=nameText(text)}});
      st.qa=text;updateJournal(Flow.reading());const e=el();if(e)e.textContent=nameText(text);
    }catch(e){const x=el();if(!x)return;
      if(e&&e.code==="not_granted"){SAMPLE=null;x.closest("section").remove()}
      else x.textContent=(e&&e.text)||"Bánh chúi chưa nghĩ ra kịp, bạn iu hỏi lại ở ô chat bên dưới nha 🍌";}
  },
  async ask(q){
    this.push({role:"me",text:q});
    if(!SAMPLE){const a=this.localAnswer(q);this.push({role:"bot",text:a.text});if(a.draw){this.picking=true;this.render()}return}
    this.busy=true;
    const turns=[{role:"user",content:this.rules()},{role:"assistant",content:"Dạ Bánh chúi hiểu rồi nè 🍌"}];
    this.st.chat.forEach(m=>{const role=m.role==="me"?"user":"assistant",content=m.card?`[Rút thêm lá ${byId(m.card.id).vi}${m.card.rev?" ngược":""}] ${m.text}`:m.text;
      const last=turns[turns.length-1];if(last.role===role)last.content+="\n"+content;else turns.push({role,content})});
    const bot={role:"bot",text:"Bánh chúi đang nghĩ nè…"};this.st.chat.push(bot);this.render();
    const bubble=()=>{const ms=$("#msgs");return ms&&ms.lastElementChild};
    this.ctl=new AbortController();
    try{
      const {text}=await SAMPLE(turns,{cache:false,modelTier:"quick",signal:this.ctl.signal,onText:({text})=>{bot.text=text;const b=bubble();if(b)b.textContent=text}});
      bot.text=text;
    }catch(e){
      if(e&&e.code==="not_granted"){SAMPLE=null;bot.text=this.localAnswer(q).text}
      else if(e&&e.code==="rate_limited")bot.text="Bánh chúi hơi mệt xíu rồi, bạn iu đợi một lát rồi hỏi lại nha 🍌";
      else if(e&&e.code==="cancelled")bot.text=e.text||"…";
      else bot.text=(e&&e.text)||this.localAnswer(q).text;
    }
    this.busy=false;updateJournal(Flow.reading());this.render();
  }
};

/* =========================================================
   LƯU ẢNH STORY 9:16 (html2canvas)
   ========================================================= */
let h2cP=null;
function loadH2C(){return h2cP||(h2cP=new Promise((res,rej)=>{if(window.html2canvas)return res(window.html2canvas);
  const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
  s.onload=()=>res(window.html2canvas);s.onerror=()=>{h2cP=null;rej(new Error("load"))};document.head.appendChild(s)}))}
async function makeStory(r,it){
  const btn=$("#story");if(btn){btn.disabled=true;btn.textContent="Bánh chúi đang vẽ ảnh…"}
  const reset=()=>{if(btn){btn.disabled=false;btn.textContent="Lưu ảnh để đăng story 📸"}};
  let h2c;try{h2c=await loadH2C()}catch(e){toast("Chưa tải được công cụ chụp ảnh, bạn iu thử lại sau nha");reset();return}
  const sp=SPREADS.find(s=>s.id===r.spread),names=r.names||[],n=r.cards.length;
  const w=n===1?140:n<=3?92:n===4?72:n<=6?78:n<=10?56:50;
  const d=new Date(r.ts);
  const node=document.createElement("div");node.className="story";
  node.innerHTML=`<div class="st-top">${mascot("m")}Bánh chúi Tarot<span style="margin-left:auto;font-weight:600;font-size:12px">${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}</span></div>
   <div style="display:flex;flex-direction:column;gap:4px"><span class="eyebrow" style="color:#6E6380">${TOPICS[r.topic].emo} ${TOPICS[r.topic].label}</span><h2>${esc(sp.id==="daily"?"Lá bài hôm nay của "+youi():sp.name)}</h2>
   ${r.question?`<p style="font-size:13px;font-weight:600">“${esc(clip(r.question,90))}”</p>`:""}</div>
   <div class="st-cards">${r.cards.map(c=>`<div class="st-c" style="width:${w+6}px">${faceHTML(c.card,w,c.rev)}${n>1?`<span>${esc(clip(posLabel(sp,c.pos,names),22))}${c.rev?" · ngược":""}</span>`:""}</div>`).join("")}</div>
   ${n===1?`<div style="text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center"><b style="font-size:20px">${esc(r.cards[0].card.vi)}${r.cards[0].rev?" (ngược)":""}</b><div class="kws" style="justify-content:center">${kws(r.cards[0].card,r.cards[0].rev).map(k=>`<span class="kw" style="background:#fff">${k}</span>`).join("")}</div></div>`:""}
   <div class="st-sum"><b>Bánh chúi nói nè 💛</b><p>${esc(clip(n===1&&r.spread!=="yesno"?meaning(r.cards[0].card,r.topic,r.cards[0].rev):(it?it.summary:""),n>3?150:n>1?200:240))}</p></div>
   <p class="st-foot">${DISCLAIMER}</p>`;
  document.body.appendChild(node);
  try{
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const cv=await h2c(node,{scale:3,backgroundColor:"#EADCF0",logging:false,useCORS:true});
    const url=cv.toDataURL("image/png");
    const blob=await new Promise(res=>cv.toBlob(res,"image/png"));
    const fname=`banh-chui-tarot-${dkey(d)}.png`;
    const bg=sheet(`<h3 class="h-sec" style="text-align:center">Ảnh story của ${esc(youi())} nè 📸</h3><img class="story-img" src="${url}" alt="Ảnh story trải bài">
      <button class="btn-main btn-block" id="dl-story">Lưu ảnh về máy</button><p class="muted" style="text-align:center;font-size:13px">Nếu nút chưa chạy, bạn iu nhấn giữ vào ảnh để lưu nha.</p><button class="btn-ghost btn-block" data-close>Đóng</button>`);
    $("#dl-story",bg).addEventListener("click",async()=>{
      if(DL){try{await DL.save({filename:fname,data:blob});toast("Lưu xong rồi nè, đăng story thôi bạn iu ✨")}catch(e){if(!e||e.code!=="declined")toast("Chưa lưu được, bạn iu nhấn giữ ảnh để lưu nha")}return}
      const a=document.createElement("a");a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();
    });
  }catch(e){toast("Bánh chúi vẽ ảnh chưa được, bạn iu thử lại nha")}
  finally{node.remove();reset()}
}

function showWelcome(){
  const w=document.createElement("div");w.className="welcome";w.setAttribute("role","dialog");w.setAttribute("aria-label","Chào mừng");
  const hero=()=>{w.innerHTML=`<div class="welcome-in">
    <span class="sparkle twinkle" style="width:22px;top:-6px;left:8px">${STAR}</span><span class="sparkle twinkle" style="width:14px;top:40px;right:0;animation-delay:.6s">${STAR}</span><span class="sparkle twinkle" style="width:18px;bottom:120px;left:-14px;animation-delay:1.1s">${STAR}</span>
    ${mascot("m")}
    <h1 class="h-big">Chào bạn iu!<br>Mình là Bánh chúi 🍌</h1>
    <p style="max-width:320px">Mỗi ngày mình cùng bốc một lá bài, nghe lòng mình nói gì, rồi sống thật dịu dàng nha. Bạn iu tự tay chọn lá, Bánh chúi giải nghĩa cho nè ✨</p></div>
    <div class="acts"><button class="btn-main" data-start>Bắt đầu nè</button></div>`};
  const form=()=>{w.innerHTML=`<div class="welcome-in" style="width:100%;max-width:360px">${mascot("m","width:96px;height:104px")}
    <h1 class="h-big" style="font-size:24px">Cho Bánh chúi làm quen xíu nha 💛</h1>
    <p style="font-size:14px">Bánh chúi sẽ gọi đúng tên bạn iu và giải bài hợp với bạn iu hơn đó.</p>${profileFormHTML(PROFILE)}</div>`;
    bindProfileForm(w,finish)};
  const finish=()=>{store.set("bc_seen",1);w.remove();go("home");if(nick())toast(`Chào ${youi()} nè 🍌`)};
  hero();document.body.appendChild(w);
  w.addEventListener("click",e=>{
    if(e.target.closest("[data-start]")){form();w.scrollTop=0}
    else if(e.target.closest("[data-skip]")){finish()}
  });
}
